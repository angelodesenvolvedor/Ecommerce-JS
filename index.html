<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>JS E-commerce</title>
    <link rel="stylesheet" type="text/css" href="./css/style.css" media="screen"/>
     <link rel="shortcut icon" href="./image/icone.png" type="image/x-icon">
</head>
<body>
    <form name="cadastro">
        <div class="quadro">
            <div class="logo">
                <img src="./image/logo.png" alt="Logo JS E-commerce" class="logoImg">
            </div>
            <div class="container">
                <div class="dados_pesoais">
                    <div class="secao"><span class="numSecao">1</span> Dados Pessoais </div>
                    <div class="inputs">
                        <input class="input" type="text" name="nome" placeholder="Nome Completo" maxlength="50">
                        <input class="input" type="text" name="celular" placeholder="Celular (XX) X XXXX-XXXX" maxlength="15">
                        <input class="input" type="text" name="cpf" placeholder="CPF XXX.XXX.XXX-XX" maxlength="14">
                    </div>
                </div>
            </div>
            <div class="container">
                <div class="perfil">
                    <div class="secao"><span class="numSecao">2</span> Login </div>
                    <div class="inputs">
                        <input class="input" type="text" name="email" placeholder="Email" maxlength="50">
                        <input class="input" type="password" name="senha" placeholder="Senha" maxlength="30">
                        <input class="input" type="password" name="confirmaSenha" placeholder="Confirmar Senha" maxlength="30">
                    </div>
                </div>
            </div>
            <div class="container">
                <div class="endereco">
                    <div class="secao"><span class="numSecao">3</span> Cartão </div>
                    <div class="inputs">
                        <input class="input" type="text" name="numCartao" placeholder="Numero Cartão" maxlength="19">
                        <input class="input" type="text" name="codigoSeg" placeholder="Codigo de Segurança" maxlength="4">
                        <input class="input" type="text" name="dataValidade" placeholder="Data de validade MM/AA" maxlength="5">    
                    </div>
                </div>
            </div>
            <div class="submeter">
                <p id="mensagemErro" class="msgErro"></p>
                <p id="mensagemStatus" class="msgSucesso"></p>
                <button id="botao_buscar" class="buscarBt" type="submit"> SALVAR DADOS </button>
            </div>    
        </div>  
    </form>
    <script src="./js/app.js"></script>
</body>
</html>
